<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>桌遊揪團</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">桌遊揪團</a>
    <nav class="site-nav">
      <a href="#/games">遊戲庫</a>
      <a href="#/new" class="btn btn-primary btn-sm">開新團</a>
      <div id="header-identity" class="header-identity"></div>
    </nav>
  </header>

  <main id="app" class="app">
    <div class="loading">載入中…</div>
  </main>

  <div id="identity-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>登入</h2>
      <div class="form-group">
        <label class="form-label" for="login-username">帳號</label>
        <input class="form-control" id="login-username" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">密碼</label>
        <input class="form-control" id="login-password" type="password" autocomplete="current-password">
      </div>
      <p id="login-error" class="error-text" hidden>帳號或密碼錯誤。</p>
      <div class="modal-actions">
        <button id="identity-modal-cancel" class="btn btn-ghost">先不登入</button>
        <button id="identity-modal-submit" class="btn btn-primary">登入</button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>修改資訊</h2>
      <div class="form-group">
        <label class="form-label" for="profile-name">顯示姓名</label>
        <input class="form-control" id="profile-name" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="profile-username">帳號</label>
        <input class="form-control" id="profile-username" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="profile-password">新密碼（留空＝不變更）</label>
        <input class="form-control" id="profile-password" type="password" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="profile-current-password">目前密碼（確認身分用）</label>
        <input class="form-control" id="profile-current-password" type="password" autocomplete="current-password">
      </div>
      <p id="profile-error" class="error-text" hidden></p>
      <div class="modal-actions">
        <button id="profile-modal-cancel" class="btn btn-ghost">取消</button>
        <button id="profile-modal-submit" class="btn btn-primary">儲存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
