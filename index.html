<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>桌遊揪團</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">桌遊揪團</a>
    <nav class="site-nav">
      <a href="#/games">遊戲庫</a>
      <a href="#/new" class="btn btn-primary btn-sm">開新團</a>
      <div id="header-identity" class="header-identity"></div>
    </nav>
  </header>

  <main id="app" class="app">
    <div class="loading">載入中…</div>
  </main>

  <div id="identity-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>你是哪一位？</h2>
      <div id="identity-modal-list" class="identity-modal-list"></div>
      <div class="modal-actions">
        <button id="identity-modal-cancel" class="btn btn-ghost">先不登入</button>
      </div>
    </div>
  </div>

  <div id="secret-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>需要密碼</h2>
      <p id="secret-desc">請輸入密碼。</p>
      <input id="secret-input" type="password" inputmode="text" autocomplete="off" placeholder="密碼">
      <p id="secret-error" class="error-text" hidden>密碼錯誤，請再試一次。</p>
      <div class="modal-actions">
        <button id="secret-cancel" class="btn btn-ghost">取消</button>
        <button id="secret-confirm" class="btn btn-primary">確認</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
